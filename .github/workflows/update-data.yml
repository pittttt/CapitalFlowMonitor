name: Update Data & Deploy

on:
  schedule:
    # 北京时间 16:40（UTC 08:40）收盘后更新
    - cron: "40 8 * * *"
    # 北京时间 08:10（UTC 00:10）开盘前二次运行：覆盖修正昨日官方净额
    # （hyzjl 数据盘后数小时内有修正，此时仍显示昨日数据且已修正完毕）
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 10jqka 登录 cookie（仓库 Secrets → THS_COOKIE），用于每月成分股刷新绕过登录墙
      - name: Fetch sectors (monthly refresh)
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: python scripts/fetch_sectors.py

      - name: Fetch history (incremental)
        run: python scripts/fetch_history.py

      # 数据提交后由 GitHub Pages（branch 模式，源 = main 分支 /docs 目录）自动部署
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json docs/data/history.json docs/data/sectors.json
          git diff --cached --quiet || git commit -m "chore(data): update sector history $(date +%F)"
          git push origin HEAD
