name: Update Data & Deploy

on:
  schedule:
    # 测试期：北京 17:00~19:55 每 5 分钟触发（GitHub 最短间隔 5 分钟，cron 固定 UTC）
    # 验证 schedule 注册/触发正常后，再改回 30 分钟窗口
    - cron: "*/5 9-11 * * *"
    - cron: "10 0 * * *"   # 北京 08:10 兜底
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 并发窗口保护：其他运行可能刚提交数据，先拉取最新 history.json，
      # 否则 ths_last_date 读到旧值会导致重复拉取全市场
      - name: Sync latest data
        run: git pull origin main --no-edit || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 10jqka 登录 cookie（仓库 Secrets → THS_COOKIE），用于每月成分股刷新绕过登录墙
      - name: Fetch sectors (monthly refresh)
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: python scripts/fetch_sectors.py

      # exit 3 = 资金流未结算（预期场景，07:10 那次跳过资金流，08:10 重试补齐）
      - name: Fetch history (incremental)
        run: |
          python scripts/fetch_history.py
          code=$?
          if [ $code -eq 3 ]; then
            echo "资金流数据未结算，等待下一次定时运行补齐"
            exit 0
          fi
          exit $code

      # 数据提交后由 GitHub Pages（branch 模式，源 = main 分支 /docs 目录）自动部署
      # push 前 pull --rebase，避免与本地/其他运行的并发推送冲突
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json docs/data/history.json docs/data/sectors.json
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): update sector history $(date +%F)"
            git pull --rebase origin main
            git push origin HEAD
          fi
