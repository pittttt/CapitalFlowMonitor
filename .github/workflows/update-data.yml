name: Update Data & Deploy

on:
  schedule:
    # 腾讯资金流约 17:00 结算：北京 17:10~19:40 每 30 分钟检查（已结算即写入，未结算等下次）
    # 用简单 cron 逐行注册（组合表达式在部分仓库注册异常，显示错误的下次运行时间）
    - cron: "10 9 * * *"   # 北京 17:10
    - cron: "40 9 * * *"   # 北京 17:40
    - cron: "10 10 * * *"  # 北京 18:10
    - cron: "40 10 * * *"  # 北京 18:40
    - cron: "10 11 * * *"  # 北京 19:10
    - cron: "40 11 * * *"  # 北京 19:40
    - cron: "10 0 * * *"   # 北京 08:10 兜底
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 10jqka 登录 cookie（仓库 Secrets → THS_COOKIE），用于每月成分股刷新绕过登录墙
      - name: Fetch sectors (monthly refresh)
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: python scripts/fetch_sectors.py

      # exit 3 = 资金流未结算（预期场景，07:10 那次跳过资金流，08:10 重试补齐）
      - name: Fetch history (incremental)
        run: |
          python scripts/fetch_history.py
          code=$?
          if [ $code -eq 3 ]; then
            echo "资金流数据未结算，等待下一次定时运行补齐"
            exit 0
          fi
          exit $code

      # 数据提交后由 GitHub Pages（branch 模式，源 = main 分支 /docs 目录）自动部署
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json docs/data/history.json docs/data/sectors.json
          git diff --cached --quiet || git commit -m "chore(data): update sector history $(date +%F)"
          git push origin HEAD
